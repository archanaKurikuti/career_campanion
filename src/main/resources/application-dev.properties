# Development Profile Properties
spring.config.activate.on-profile=dev

# Server
server.port=${PORT:8080}

# Local MySQL Development Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/career_companion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT Configuration
jwt.secret=${JWT_SECRET:aW52YWxpZC1zZWNyZXQta2V5LWZvci1jYXJlZXItY29tcGFuaW9u}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini AI Configuration
# In dev, prefer environment variable for key or leave empty to use fallback.
ai.api-key=${GEMINI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# Retry/backoff for local testing
ai.retry.attempts=${AI_RETRY_ATTEMPTS:4}
ai.retry.baseDelayMs=${AI_RETRY_BASE_DELAY_MS:500}
